# Runtime Computational Memory -- Qwen/Qwen2.5-7B-Instruct
# S8 sweep. Needs a 24 GB GPU (L4 / A10 / A100) in bf16.
# Run:  python -m rcm.cli run --config configs/qwen2.5-7b.yaml
# Only the model block differs from default.yaml; the probes, thresholds,
# grid and budget are identical, so results are directly comparable.
model:
  backend: hf
  name: qwen2.5-7b
  hf_model_id: Qwen/Qwen2.5-7B-Instruct
  max_seq_len: 1024        # attention-tap buffer; real tokenizers use more tokens per sentence
metrics:
  z_star: 1.0
  lam: 0.30
  p_star: 0.10
  top_k: 8
  smooth_window: 8
  kappa: 1.0
  pagerank_damping: 0.85
  sink_positions: 4
  fdr_alpha: 0.05
  n_reservoirs: 4
  probe_folds: 5
intervention:
  modes: [ablate, perturb, gate]
  epsilon: 1.0
  gate: 0.10
  max_ppl_increase: 0.05
  max_acc_drop: 0.02
  n_bootstrap: 2000
  alpha: 0.05
run:
  seeds: [0, 1, 2, 3, 4]
  pressures: [0.0, 0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875, 1.0]
  arms: [shared-kv, text-only, isolated]
  n_turns: 8
  max_new_tokens: 10
  raw_kv_sample_rate: 0.05
out_dir: results_qwen2.5-7b
probe_suite: synthetic-bbq
master_seed: 1234
