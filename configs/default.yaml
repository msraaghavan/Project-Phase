# Runtime Computational Memory -- default experiment (fully determines a run)
model:
  backend: tiny            # "tiny" = CPU reference transformer; "hf" = frozen open-weight model
  name: tiny-gqa-4L8H
  hf_model_id: null        # e.g. meta-llama/Meta-Llama-3-8B-Instruct for the hf backend
  d_model: 128
  n_layers: 4
  n_heads: 8
  n_kv_heads: 2
  d_ff: 256
  max_seq_len: 512
metrics:                   # pre-registered thresholds (Module 2)
  z_star: 1.0
  lam: 0.30
  p_star: 0.10
  top_k: 8
  smooth_window: 8
  kappa: 1.0
  pagerank_damping: 0.85
  sink_positions: 4
  fdr_alpha: 0.05
  n_reservoirs: 4
  probe_folds: 5
intervention:              # Module 4 budget
  modes: [ablate, perturb, gate]
  epsilon: 1.0
  gate: 0.10
  max_ppl_increase: 0.05
  max_acc_drop: 0.02
  n_bootstrap: 2000
  alpha: 0.05
run:
  seeds: [0, 1, 2, 3, 4]
  pressures: [0.0, 0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875, 1.0]
  arms: [shared-kv, text-only, isolated]
  n_turns: 8
  max_new_tokens: 10
  raw_kv_sample_rate: 0.05
  train_steps: 1200
  train_batch: 16
out_dir: results
probe_suite: synthetic-bbq
master_seed: 1234
